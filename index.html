
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tehran Clock</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000;
}
#background {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    object-fit: contain; z-index: 0;
}
canvas {
    position: fixed; inset: 0;
    display: block; width: 100vw; height: 100vh;
    z-index: 1; background: transparent;
}
</style>
</head>
<body>
<img id="background" src="background.png" alt="">
<canvas id="clock"></canvas>

<script>
(function () {
    var canvas = document.getElementById("clock");
    var ctx = canvas.getContext("2d");
    var W = 0, H = 0, dpr = 1;
    var DESIGN_W = 2048, DESIGN_H = 990;

    var timeBase = Date.now();
    var syncBase = Date.now();
    var tehranOffset = 12600000; // fallback: UTC+03:30
    var onlineSynced = false;

    function getTehranNow() {
        return new Date(timeBase + (Date.now() - syncBase) + tehranOffset);
    }

    function syncTime() {
        var started = Date.now();
        var xhr = new XMLHttpRequest();
        xhr.open(
            "GET",
            "https://worldtime.timezone.io/api/timezone/Asia/Tehran",
            true
        );
        xhr.timeout = 8000;

        xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;

            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    var serverEpoch = Number(data.unixtime) * 1000;
                    var offsetText = data.utc_offset || "+03:30";
                    var sign = offsetText.charAt(0) === "-" ? -1 : 1;
                    var parts = offsetText.substring(1).split(":");
                    var offsetMinutes =
                        (parseInt(parts[0], 10) * 60) +
                        parseInt(parts[1], 10);

                    if (serverEpoch > 0 && isFinite(offsetMinutes)) {
                        var finished = Date.now();
                        timeBase = serverEpoch + (finished - started) / 2;
                        syncBase = finished;
                        tehranOffset = sign * offsetMinutes * 60000;
                        onlineSynced = true;
                    }
                } catch (e) {}
            }
        };

        xhr.onerror = function () {};
        xhr.ontimeout = function () {};

        try { xhr.send(); } catch (e) {}
    }

    function resize() {
        W = window.innerWidth || 1280;
        H = window.innerHeight || 720;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function line(x1, y1, x2, y2, width, color) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.strokeStyle = color;
        ctx.lineCap = "round";
        ctx.stroke();
    }

    function drawHands(now) {
        var cx = 1024, cy = 495;
        var sec = now.getUTCSeconds() + now.getUTCMilliseconds() / 1000;
        var min = now.getUTCMinutes() + sec / 60;
        var hour = (now.getUTCHours() % 12) + min / 60;

        function hand(value60, length, tail, width, color) {
            var angle = value60 * Math.PI * 2 / 60 - Math.PI / 2;
            line(
                cx - Math.cos(angle) * tail,
                cy - Math.sin(angle) * tail,
                cx + Math.cos(angle) * length,
                cy + Math.sin(angle) * length,
                width, color
            );
        }

        hand(hour * 5, 160, 14, 25, "#f5f5f5");
        hand(min, 275, 14, 19, "#f5f5f5");
        hand(sec, 405, 60, 4, "#55aaff");

        ctx.beginPath();
        ctx.arc(cx, cy, 17, 0, Math.PI * 2);
        ctx.fillStyle = "#55aaff";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#111";
        ctx.fill();
    }

    function drawCenterInfo(now) {
        var days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
        var h = now.getUTCHours();
        var m = now.getUTCMinutes();
        var suffix = h >= 12 ? "PM" : "AM";
        var displayH = h % 12 || 12;
        var mm = m < 10 ? "0" + m : "" + m;

        ctx.textBaseline = "middle";
        ctx.textAlign = "left";

        /* Digital clock — no extra icon */
        ctx.font = "43px Arial, Helvetica, sans-serif";
        ctx.fillStyle = "#f2f2f2";
        ctx.fillText(displayH + ":" + mm + suffix, 610, 495);

        ctx.font = "700 43px Arial, Helvetica, sans-serif";
        ctx.fillStyle = "#55aaff";
        ctx.fillText(days[now.getUTCDay()], 1260, 495);

        ctx.font = "43px Arial, Helvetica, sans-serif";
        ctx.fillStyle = "#f2f2f2";
        ctx.fillText("" + now.getUTCDate(), 1378, 495);
    }

    function render() {
        ctx.clearRect(0, 0, W, H);

        var scale = Math.min(W / DESIGN_W, H / DESIGN_H);
        var ox = (W - DESIGN_W * scale) / 2;
        var oy = (H - DESIGN_H * scale) / 2;

        ctx.save();
        ctx.translate(ox, oy);
        ctx.scale(scale, scale);

        var now = getTehranNow();
        drawHands(now);
        drawCenterInfo(now);

        ctx.restore();

        var raf = window.requestAnimationFrame ||
                  window.webkitRequestAnimationFrame;
        if (raf) raf(render);
        else window.setTimeout(render, 33);
    }

    window.addEventListener("resize", resize, false);
    resize();
    syncTime();
    window.setInterval(syncTime, 60000);
    render();

    document.addEventListener("dblclick", function () {
        var el = document.documentElement;
        var fn = el.requestFullscreen ||
                 el.webkitRequestFullscreen ||
                 el.msRequestFullscreen;
        if (fn) {
            try { fn.call(el); } catch (e) {}
        }
    }, false);
}());
</script>
</body>
</html>
