<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock Overlay</title>
<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
}

:fullscreen {
    background: #000 !important;
}

/* Your PNG goes behind the clock.
   Rename your PNG to: background.png
   Best size: 2048 × 990 px */
#background {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    object-position: center;
    z-index: 0;
}

canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    background: transparent;
}
</style>
</head>
<body>

<img id="background" src="background.png" alt="">
<canvas id="clock"></canvas>

<script>
const canvas = document.getElementById("clock");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, dpr = 1;

const DESIGN_W = 2048;
const DESIGN_H = 990;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);

function line(x1, y1, x2, y2, width, color) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.lineCap = "round";
    ctx.stroke();
}

function drawCenterInfo(now) {
    const days = ["SUN","MON","TUE","WED","THU","FRI","SAT"];

    ctx.textBaseline = "middle";
    ctx.textAlign = "left";

    // Alarm
    ctx.font = '700 43px Arial, Helvetica, sans-serif';
    ctx.fillStyle = "#55aaff";
    ctx.fillText("◷", 610, 495);

    ctx.font = '43px Arial, Helvetica, sans-serif';
    ctx.fillStyle = "#f2f2f2";

    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2, "0");
    const suffix = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    ctx.fillText(`${h}:${m}${suffix}`, 675, 495);

    // Date
    ctx.font = '700 43px Arial, Helvetica, sans-serif';
    ctx.fillStyle = "#55aaff";
    ctx.fillText(days[now.getDay()], 1260, 495);

    ctx.font = '43px Arial, Helvetica, sans-serif';
    ctx.fillStyle = "#f2f2f2";
    ctx.fillText(String(now.getDate()), 1378, 495);
}

function drawHands(now) {
    const cx = 1024;
    const cy = 495;

    const ms = now.getMilliseconds();
    const sec = now.getSeconds() + ms / 1000;
    const min = now.getMinutes() + sec / 60;
    const hour = (now.getHours() % 12) + min / 60;

    function hand(value60, length, tail, width, color) {
        const angle = value60 * Math.PI * 2 / 60 - Math.PI / 2;

        const x1 = cx - Math.cos(angle) * tail;
        const y1 = cy - Math.sin(angle) * tail;
        const x2 = cx + Math.cos(angle) * length;
        const y2 = cy + Math.sin(angle) * length;

        line(x1, y1, x2, y2, width, color);
    }

    // White hour hand
    hand(hour * 5, 160, 14, 25, "#f5f5f5");

    // White minute hand
    hand(min, 275, 14, 19, "#f5f5f5");

    // Blue seconds hand
    hand(sec, 405, 60, 4, "#55aaff");

    // Center pin
    ctx.beginPath();
    ctx.arc(cx, cy, 17, 0, Math.PI * 2);
    ctx.fillStyle = "#55aaff";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fillStyle = "#111";
    ctx.fill();
}

function render() {
    ctx.clearRect(0, 0, W, H);

    const scale = Math.min(W / DESIGN_W, H / DESIGN_H);
    const ox = (W - DESIGN_W * scale) / 2;
    const oy = (H - DESIGN_H * scale) / 2;

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);

    const now = new Date();

    // IMPORTANT:
    // No background and no tick/line drawing here.
    // Those come entirely from background.png.
    drawHands(now);
    drawCenterInfo(now);

    ctx.restore();

    requestAnimationFrame(render);
}

resize();
render();

document.addEventListener("dblclick", async () => {
    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        } else {
            await document.exitFullscreen();
        }
    } catch (_) {}
});
</script>
</body>
</html>
