
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tehran Clock</title>

<style>
@font-face {
    font-family: "Pinar";
    src: url("Pinar-Bold.ttf") format("truetype");
    font-weight: 700;
    font-style: normal;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#background {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    z-index: 0;
}

canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    background: transparent;
}
</style>
</head>

<body>
<img id="background" src="background.png" alt="">
<canvas id="clock"></canvas>

<script>
(function () {
    var canvas = document.getElementById("clock");
    var ctx = canvas.getContext("2d");
    var W = 0, H = 0, dpr = 1;
    var DESIGN_W = 2048, DESIGN_H = 990;

    var timeBase = Date.now();
    var syncBase = Date.now();
    var tehranOffset = 12600000;
    var onlineSynced = false;
    var syncInProgress = false;
    var retryDelay = 15000;
    var syncTimer = null;

    function getTehranNow() {
        return new Date(
            timeBase + (Date.now() - syncBase) + tehranOffset
        );
    }

    function scheduleSync(delay) {
        if (syncTimer !== null) {
            clearTimeout(syncTimer);
        }

        syncTimer = setTimeout(syncTime, delay);
    }

    function syncTime() {
        if (syncInProgress) return;

        syncInProgress = true;
        var started = Date.now();
        var completed = false;
        var xhr = new XMLHttpRequest();

        function finish(success) {
            if (completed) return;
            completed = true;
            syncInProgress = false;

            if (success) {
                scheduleSync(60000);
            } else {
                scheduleSync(retryDelay);
            }
        }

        xhr.open(
            "GET",
            "https://worldtime.timezone.io/api/timezone/Asia/Tehran",
            true
        );

        xhr.timeout = 8000;

        xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4 || completed) return;

            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    var serverEpoch = Number(data.unixtime) * 1000;
                    var offsetText = data.utc_offset || "+03:30";
                    var sign = offsetText.charAt(0) === "-" ? -1 : 1;
                    var parts = offsetText.substring(1).split(":");

                    var offsetHours = parseInt(parts[0], 10);
                    var offsetMins = parseInt(parts[1], 10);
                    var offsetMinutes = offsetHours * 60 + offsetMins;

                    if (
                        serverEpoch > 0 &&
                        isFinite(offsetMinutes) &&
                        parts.length === 2
                    ) {
                        var finished = Date.now();

                        timeBase = serverEpoch + (finished - started) / 2;
                        syncBase = finished;
                        tehranOffset = sign * offsetMinutes * 60000;
                        onlineSynced = true;

                        finish(true);
                        return;
                    }
                } catch (e) {}
            }

            finish(false);
        };

        xhr.onerror = function () {
            finish(false);
        };

        xhr.ontimeout = function () {
            finish(false);
        };

        try {
            xhr.send();
        } catch (e) {
            finish(false);
        }
    }

    function resize() {
        W = window.innerWidth || 1280;
        H = window.innerHeight || 720;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function line(x1, y1, x2, y2, width, color) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.strokeStyle = color;
        ctx.lineCap = "round";
        ctx.stroke();
    }

    function drawHands(now) {
        var cx = 1024, cy = 495;

        var sec = now.getUTCSeconds() +
                  now.getUTCMilliseconds() / 1000;

        var min = now.getUTCMinutes() + sec / 60;
        var hour = (now.getUTCHours() % 12) + min / 60;

        function hand(value60, length, tail, width, color) {
            var angle = value60 * Math.PI * 2 / 60 - Math.PI / 2;

            line(
                cx - Math.cos(angle) * tail,
                cy - Math.sin(angle) * tail,
                cx + Math.cos(angle) * length,
                cy + Math.sin(angle) * length,
                width,
                color
            );
        }

        hand(hour * 5, 160, 14, 25, "#f5f5f5");
        hand(min, 275, 14, 19, "#f5f5f5");
        hand(sec, 405, 60, 4, "#55aaff");

        ctx.beginPath();
        ctx.arc(cx, cy, 17, 0, Math.PI * 2);
        ctx.fillStyle = "#55aaff";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#111";
        ctx.fill();
    }

    function gregorianToJalali(gy, gm, gd) {
        var gdm = [
            0, 31, 59, 90, 120, 151,
            181, 212, 243, 273, 304, 334
        ];

        var jy = gy > 1600 ? 979 : 0;
        gy -= gy > 1600 ? 1600 : 621;

        var gy2 = gm > 2 ? gy + 1 : gy;

        var days =
            365 * gy +
            Math.floor((gy2 + 3) / 4) -
            Math.floor((gy2 + 99) / 100) +
            Math.floor((gy2 + 399) / 400) -
            80 + gd + gdm[gm - 1];

        jy += 33 * Math.floor(days / 12053);
        days %= 12053;

        jy += 4 * Math.floor(days / 1461);
        days %= 1461;

        if (days > 365) {
            jy += Math.floor((days - 1) / 365);
            days = (days - 1) % 365;
        }

        var jm, jd;

        if (days < 186) {
            jm = 1 + Math.floor(days / 31);
            jd = 1 + (days % 31);
        } else {
            jm = 7 + Math.floor((days - 186) / 30);
            jd = 1 + ((days - 186) % 30);
        }

        return {
            year: jy,
            month: jm,
            day: jd
        };
    }

    function drawCenterInfo(now) {
        var days = [
            "sun", "mon", "tue", "wed",
            "thu", "fri", "sat"
        ];

        var months = [
            "فروردین", "اردیبهشت", "خرداد",
            "تیر", "مرداد", "شهریور",
            "مهر", "آبان", "آذر",
            "دی", "بهمن", "اسفند"
        ];

        var h = now.getUTCHours();
        var m = now.getUTCMinutes();
        var suffix = h >= 12 ? "PM" : "AM";
        var displayH = h % 12 || 12;
        var mm = m < 10 ? "0" + m : "" + m;

        var jalali = gregorianToJalali(
            now.getUTCFullYear(),
            now.getUTCMonth() + 1,
            now.getUTCDate()
        );

        var dateText = jalali.day + " " + months[jalali.month - 1];
        var weekday = days[now.getUTCDay()];

        ctx.textBaseline = "middle";
        ctx.textAlign = "left";

        /* Digital clock — Pinar Bold */
        ctx.font = '700 43px "Pinar", Arial, sans-serif';
        ctx.fillStyle = "#f2f2f2";
        ctx.fillText(displayH + ":" + mm + suffix, 610, 495);

        /* Weekday — blue, Pinar Bold */
        ctx.font = '700 34px "Pinar", Arial, sans-serif';
        ctx.fillStyle = "#55aaff";
        ctx.fillText(weekday, 1210, 495);

        /* Persian date — white, with spacing */
        ctx.font = '700 36px "Pinar", Tahoma, sans-serif';
        ctx.fillStyle = "#f2f2f2";
        ctx.fillText(dateText, 1310, 495);
    }

    function render() {
        ctx.clearRect(0, 0, W, H);

        var scale = Math.min(W / DESIGN_W, H / DESIGN_H);
        var ox = (W - DESIGN_W * scale) / 2;
        var oy = (H - DESIGN_H * scale) / 2;

        ctx.save();
        ctx.translate(ox, oy);
        ctx.scale(scale, scale);

        var now = getTehranNow();

        drawHands(now);
        drawCenterInfo(now);

        ctx.restore();

        var raf = window.requestAnimationFrame ||
                  window.webkitRequestAnimationFrame;

        if (raf) raf(render);
        else window.setTimeout(render, 33);
    }

    window.addEventListener("resize", resize, false);

    resize();
    syncTime();
    render();

    document.addEventListener("dblclick", function () {
        var el = document.documentElement;

        var fn = el.requestFullscreen ||
                 el.webkitRequestFullscreen ||
                 el.msRequestFullscreen;

        if (fn) {
            try {
                fn.call(el);
            } catch (e) {}
        }
    }, false);
}());
</script>
</body>
</html>
