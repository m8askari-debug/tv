
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock TV</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

#background {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
}

#clock {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
}
</style>
</head>

<body>
<img id="background" src="background.png" alt="">
<canvas id="clock"></canvas>

<script type="text/javascript">
(function () {
    var canvas = document.getElementById("clock");
    var ctx = null;

    try {
        ctx = canvas.getContext("2d");
    } catch (e) {
        return;
    }

    if (!ctx) {
        return;
    }

    var W = 1280;
    var H = 720;
    var DESIGN_W = 2048;
    var DESIGN_H = 990;

    function resize() {
        W = window.innerWidth || 1280;
        H = window.innerHeight || 720;

        canvas.width = W;
        canvas.height = H;
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
    }

    function drawLine(x1, y1, x2, y2, width, color) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = width;
        ctx.strokeStyle = color;
        ctx.lineCap = "round";
        ctx.stroke();
    }

    function drawHand(value, length, tail, width, color, cx, cy) {
        var angle = value * Math.PI / 30 - Math.PI / 2;

        drawLine(
            cx - Math.cos(angle) * tail,
            cy - Math.sin(angle) * tail,
            cx + Math.cos(angle) * length,
            cy + Math.sin(angle) * length,
            width,
            color
        );
    }

    function drawClock() {
        ctx.clearRect(0, 0, W, H);

        var scale = Math.min(W / DESIGN_W, H / DESIGN_H);
        var ox = (W - DESIGN_W * scale) / 2;
        var oy = (H - DESIGN_H * scale) / 2;

        ctx.save();
        ctx.translate(ox, oy);
        ctx.scale(scale, scale);

        var now = new Date();
        var sec = now.getSeconds();
        var min = now.getMinutes() + sec / 60;
        var hour = (now.getHours() % 12) + min / 60;

        var cx = 1024;
        var cy = 495;

        drawHand(hour * 5, 160, 14, 25, "#f5f5f5", cx, cy);
        drawHand(min, 275, 14, 19, "#f5f5f5", cx, cy);
        drawHand(sec, 405, 60, 4, "#55aaff", cx, cy);

        ctx.beginPath();
        ctx.arc(cx, cy, 17, 0, Math.PI * 2);
        ctx.fillStyle = "#55aaff";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#111111";
        ctx.fill();

        var days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
        var h = now.getHours();
        var displayH = h % 12;
        if (displayH === 0) {
            displayH = 12;
        }

        var mm = now.getMinutes();
        var minuteText = mm < 10 ? "0" + mm : "" + mm;
        var suffix = h >= 12 ? "PM" : "AM";

        ctx.textBaseline = "middle";
        ctx.textAlign = "left";

        ctx.font = "bold 43px Arial";
        ctx.fillStyle = "#55aaff";
        ctx.fillText("◷", 610, 495);

        ctx.font = "43px Arial";
        ctx.fillStyle = "#f2f2f2";
        ctx.fillText(displayH + ":" + minuteText + suffix, 675, 495);

        ctx.font = "bold 43px Arial";
        ctx.fillStyle = "#55aaff";
        ctx.fillText(days[now.getDay()], 1260, 495);

        ctx.font = "43px Arial";
        ctx.fillStyle = "#f2f2f2";
        ctx.fillText("" + now.getDate(), 1378, 495);

        ctx.restore();
    }

    function loop() {
        drawClock();
        window.setTimeout(loop, 1000);
    }

    if (window.addEventListener) {
        window.addEventListener("resize", resize, false);
    } else {
        window.onresize = resize;
    }

    resize();
    loop();
}());
</script>
</body>
</html>
